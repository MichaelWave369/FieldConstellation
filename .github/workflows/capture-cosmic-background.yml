name: One-time cosmic background asset import
on:
  push:
    branches:
      - feat/cosmic-gateway-bg-r29
    paths:
      - .github/workflows/capture-cosmic-background.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new art branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import precisely validated public preview asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/gateway
          curl --fail --show-error --silent --location --retry 2 --max-time 40 \
            'https://enterthefield-portal-review.netlify.app/gateway/cosmic-field.webp' \
            --output src/gateway/cosmic-field.webp
          printf '%s\n' '65d6b59bd87a232a8da6800714dba5d78440c4f8ab41abe466f8340184bcd2dc  src/gateway/cosmic-field.webp' | sha256sum --check
          file --mime-type src/gateway/cosmic-field.webp | grep -q 'image/webp'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gateway/cosmic-field.webp
          git commit -m 'assets: commit exact optimized cosmic portal WebP'
          git push origin HEAD:feat/cosmic-gateway-bg-r29
